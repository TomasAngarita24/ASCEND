server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Compression for text assets. Proxied API responses are gzipped by the backend,
  # so no gzip_proxied handling is needed here.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml text/xml application/manifest+json;

  # Backend API route prefixes (same-origin so httpOnly cookies flow normally).
  location ~ ^/(auth|exercises|routines|routine-templates|workouts|social|users|progress|measurements|health)(/|$) {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # Hashed build assets (/assets/*) are content-addressed and cacheable forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker and manifest must always be revalidated on launch.
  location = /sw.js {
    expires -1;
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    expires -1;
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: serve assets when present, otherwise index.html (never cached).
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}