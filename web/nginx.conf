server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Backend API route prefixes (same-origin so httpOnly cookies flow normally).
  location ~ ^/(auth|exercises|routines|routine-templates|workouts|social|users|progress|measurements|health)(/|$) {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
  }

  # SPA fallback: serve assets when present, otherwise index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}